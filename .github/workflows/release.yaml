name: Release

# An action is consumed by tag: the workflows that use it pin @v1, or a
# commit SHA with the version beside it, which Renovate moves from release to
# release. release-please cuts vX.Y.Z from the Conventional Commits on main,
# and the major tag (v1) then moves to the newest release, so @v1 always
# means the newest compatible version.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

# Never cancel a release half-way: that can leave a release whose major tag
# wasn't moved. Each commit gets its own run; only the gate below cancels
# anything, and only its own older runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # A push to main that lands while an older push is still in its gate
  # cancels that gate: the older run then skips release-please, which would
  # only find that main has moved on.
  check:
    name: Check
    uses: ./.github/workflows/check.yaml
    concurrency:
      group: ${{ github.workflow }}-gate-${{ github.ref }}
      cancel-in-progress: true

  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    needs:
      - check
    steps:
      # Renovate automerges in quick succession. A run whose commit is no longer
      # main's tip leaves release-please to the newer run, so a stale run cannot
      # rewrite the release PR behind a newer one.
      - name: Refuse to act unless this run's head is still main's tip
        id: still-current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tip="$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)"
          if [ "$tip" = "${{ github.sha }}" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main has moved to $tip since this run started at ${{ github.sha }}; leaving release-please to that run."
          fi

      # GitHub doesn't start workflows for what GITHUB_TOKEN does: a release
      # pull request it opens or updates gets a CI run that waits for
      # approval. RELEASE_PLEASE_TOKEN, a fine-grained personal access token
      # with read and write access to this repository's contents, pull
      # requests and issues, makes the pull request an ordinary one whose CI
      # runs. Without the secret, release-please falls back to GITHUB_TOKEN.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release-please
        if: steps.still-current.outputs.current == 'true'
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
      major: ${{ steps.release-please.outputs.major }}

  major-tag:
    name: Move the major version tag
    runs-on: ubuntu-latest
    needs:
      - release-please
    if: needs.release-please.outputs.release_created == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Point the major tag at the release
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          MAJOR: v${{ needs.release-please.outputs.major }}
        run: |
          set -euo pipefail
          git tag --force "${MAJOR}" "${TAG}^{commit}"
          git push --force origin "refs/tags/${MAJOR}"
          echo "::notice::${MAJOR} now points at ${TAG}"
