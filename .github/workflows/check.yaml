name: Check

# The action: lint, and an upload to a mock Static Pages server. ci.yaml calls
# it for pull requests, release.yaml gates every release on it, and it runs on
# its own from the Actions tab.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  # Each job installs the tools listed below with mise-action's install_args.
  # Without this, `mise run` installs every tool in .mise.toml first.
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  # mise itself, pinned. Unpinned, mise-action picks the newest release and
  # leaves it out of its cache key, so every new mise release finds an older
  # binary in the restored cache, warns that it failed integrity verification
  # and downloads it again.
  # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
  MISE_VERSION: 2026.10.5
  # Every tool a job here runs, installed in every job. mise-action keys its
  # cache on install_args, so one list means one cache.
  MISE_TOOLS: yamllint actionlint shellcheck yq node

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: ${{ env.MISE_TOOLS }}

      - name: Lint YAML
        run: mise run yaml-lint

      # The matcher turns actionlint's output into annotations on the PR diff.
      # shellcheck is installed above, so the `run:` scripts are checked too.
      - name: Lint workflows
        run: |
          echo "::add-matcher::.github/actionlint-matcher.json"
          mise run actionlint

      - name: Lint the action's script
        run: mise run action-lint

  # Runs the action from this checkout against test/mock-server.mjs, with a
  # real OIDC token, and checks what arrived. Pull requests from forks get no
  # OIDC token, so this job fails for them.
  test:
    name: Upload to a mock server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: ${{ env.MISE_TOOLS }}

      - name: Start the mock Static Pages server
        run: |
          set -euo pipefail
          nohup node test/mock-server.mjs 8080 > "${RUNNER_TEMP}/requests.jsonl" 2>&1 &
          for _ in $(seq 1 50); do
            curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 && exit 0
            sleep 0.2
          done
          echo "::error::the mock server didn't start"
          cat "${RUNNER_TEMP}/requests.jsonl"
          exit 1

      # A trailing slash, which the action strips before appending /api/upload.
      - name: Upload the test site
        id: upload
        uses: ./
        with:
          endpoint: http://127.0.0.1:8080/
          site-dir: test/site/

      - name: Upload to an endpoint that fails
        id: failing
        continue-on-error: true
        uses: ./
        with:
          endpoint: http://127.0.0.1:8080/fail
          site-dir: test/site/

      - name: Check what the server received
        env:
          UPLOADED_COUNT: ${{ steps.upload.outputs.uploaded-count }}
          FAILING_OUTCOME: ${{ steps.failing.outcome }}
        run: |
          set -euo pipefail
          requests="${RUNNER_TEMP}/requests.jsonl"
          cat "${requests}"

          fail() {
            echo "::error::$1"
            exit 1
          }

          want='["assets/style.css","docs/page.html","index.html"]'
          upload="$(jq -c 'select(.path == "/api/upload")' "${requests}")"
          got="$(jq -c .files <<< "${upload}")"
          [ "${got}" = "${want}" ] || fail "the upload carried ${got}, want ${want}"
          [ "$(jq .bearerJWT <<< "${upload}")" = true ] || fail "the upload carried no OIDC token"
          [ "${UPLOADED_COUNT}" = 3 ] || fail "uploaded-count is '${UPLOADED_COUNT}', want 3"

          got="$(jq -c 'select(.path == "/fail/api/upload") | .files' "${requests}")"
          [ "${got}" = "${want}" ] || fail "the failing upload carried '${got}', want ${want}"
          [ "${FAILING_OUTCOME}" = failure ] || fail "the action succeeded on an HTTP 500"
